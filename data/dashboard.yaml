- job:
    name: 'dashboard-devenv-create'
    defaults: global
    project-type: pipeline
    sandbox: true
    parameters:
      - string:
          name: GERRIT_REFSPEC
          default: refs/heads/nectar/2025.1
          description: "The ref to use."
      - string:
          name: GERRIT_BRANCH
          default: nectar/2025.1
          description: "The branch to use."
    properties:
      - throttle:
          max-total: 5
          option: project
      - build-discarder:
          num-to-keep: 30
    triggers:
      - gerrit:
          trigger-on:
            - patchset-created-event
            - change-restored-event
            - comment-added-contains-event:
                comment-contains-value: 'recheck'
          projects:
            - project-compare-type: 'PLAIN'
              project-pattern: 'NeCTAR-RC/horizon'
              branches:
                - branch-compare-type: 'REG_EXP'
                  branch-pattern: 'nectar/.*'
            - project-compare-type: 'REG_EXP'
              project-pattern: 'NeCTAR-RC/.*-dashboard'
              branches:
                - branch-compare-type: 'REG_EXP'
                  branch-pattern: 'nectar/.*'
            - project-compare-type: 'REG_EXP'
              project-pattern: 'NeCTAR-RC/.*-ui'
              branches:
                - branch-compare-type: 'REG_EXP'
                  branch-pattern: 'nectar/.*'
          silent: false
          escape-quotes: true
    dsl: |
      pipeline {{
        agent {{ label 'docker' }}
        environment {{
          TAG = "${{"review-" + env.GERRIT_CHANGE_NUMBER + "-" + env.GERRIT_PATCHSET_NUMBER}}"
          REGISTRY = credentials('registry-nectar')
          REGISTRY_HOST="registry.rc.nectar.org.au"
          KEYSTONE = credentials('6457de6c-a455-49b4-a217-382a8425b4d6')
          GERRIT_API = credentials('2f00f9a5-00c3-42fe-82bf-cc787af1df8c')
        }}
        stages {{
          stage('Cleanup Existing') {{
            agent {{ label 'internal' }}
            steps {{
              sh '''
              export OS_USERNAME=$KEYSTONE_USR
              export OS_PASSWORD=$KEYSTONE_PSW
              export OS_AUTH_URL=http://ucc1.svc.artm.rcunder.nectar.org.au:5000/v3
              export OS_PROJECT_DOMAIN_NAME=Default
              export OS_USER_DOMAIN_NAME=Default
              export OS_IDENTITY_API_VERSION=3
              export OS_PROJECT_NAME=rcdev

              TAG_BASE=review-$GERRIT_CHANGE_NUMBER

              recordsets=`openstack recordset list rcdev.nectar.org.au. | grep ${{TAG_BASE}} | awk '{{print $2}}'`
              for i in $recordsets
              do
                  openstack recordset delete rcdev.nectar.org.au. $i
              done
              '''

              withKubeConfig([credentialsId: 'ef3bf1e0-6c6b-4bb9-80cc-4bd51e8edd89',
                    serverUrl: 'https://k8s-api.rcdev.nectar.org.au:6443',
              ]) {{
                sh '''
                  TAG_BASE=review-$GERRIT_CHANGE_NUMBER
                  namespaces=`kubectl get namespaces | grep ${{TAG_BASE}} | awk '{{print $1}}'`
                  for namespace in $namespaces
                  do
                      kubectl delete namespace $namespace
                  done
                  '''
              }}
            }}
          }}
          stage('DNS') {{
            agent {{ label 'internal' }}
            steps{{
              sh '''
              export OS_USERNAME=$KEYSTONE_USR
              export OS_PASSWORD=$KEYSTONE_PSW
              export OS_AUTH_URL=http://ucc1.svc.artm.rcunder.nectar.org.au:5000/v3
              export OS_PROJECT_DOMAIN_NAME=Default
              export OS_USER_DOMAIN_NAME=Default
              export OS_IDENTITY_API_VERSION=3
              export OS_PROJECT_NAME=rcdev
              openstack recordset create rcdev.nectar.org.au. ${{TAG}}.rcdev.nectar.org.au. --type CNAME --record lb.rcdev.nectar.org.au.
              '''
            }}
          }}
          stage('Clone') {{
            steps {{
              git poll: false,
                  url: 'ssh://jenkins@review.rc.nectar.org.au:29418/internal/nectar-kolla.git',
                  credentialsId: 'cd8b8dd3-b897-4ecb-985d-180d5b6f8498',
                  branch: '$GERRIT_BRANCH'
              dir ("src/${{env.GERRIT_PROJECT}}") {{
                checkout(
                  poll: false,
                  scm: [
                    $class: 'GitSCM',
                    branches: [[name: 'origin/$GERRIT_BRANCH']],
                    extensions: [
                      [$class: 'CloneOption', honorRefspec: true],
                      [$class: 'CleanCheckout'],
                      [$class: 'BuildChooserSetting', buildChooser: [$class: 'GerritTriggerBuildChooser']]
                    ],
                    userRemoteConfigs: [[
                      credentialsId: 'cd8b8dd3-b897-4ecb-985d-180d5b6f8498',
                      name: 'origin',
                      refspec: '$GERRIT_REFSPEC',
                      url: 'ssh://jenkins@review.rc.nectar.org.au:29418/$GERRIT_PROJECT.git'
                    ]]
                  ]
                )
              }}
            }}
          }}
          stage('Build') {{
            steps {{
              kollaBuild 'dashboard', "${{env.TAG}}", "dev/${{env.GERRIT_PROJECT}}/kolla-build.conf"
            }}
          }}
          stage('Deploy') {{
            agent {{ label 'internal' }}
            steps{{
              dir ('containers') {{
                git poll: false,
                    url: 'ssh://jenkins@review.rc.nectar.org.au:29418/internal/containers.git',
                    credentialsId: 'cd8b8dd3-b897-4ecb-985d-180d5b6f8498',
                    branch: 'master'
                retry(3) {{
                  withKubeConfig([credentialsId: 'ef3bf1e0-6c6b-4bb9-80cc-4bd51e8edd89',
                                  serverUrl: 'https://k8s-api.rcdev.nectar.org.au:6443',
                  ]) {{
                    sh '''#!/bin/bash

                    # Assume GERRIT_BRANCH is set in the environment
                    input="$GERRIT_BRANCH"

                    # Extract year and release number
                    year=$(echo "$input" | cut -d'/' -f2 | cut -d'.' -f1)
                    release=$(echo "$input" | cut -d'.' -f2)

                    # Determine value based on year and release
                    if [[ "$year" == "2023" && "$release" == "2" ]]; then
                      helm_version="3"
                    elif [[ "$year" == "2025" && "$release" == "1" ]]; then
                      helm_version="4"
                    else
                      echo "Error: Unrecognized GERRIT_BRANCH format or unsupported year/release combination: $input" >&2
                      exit 1
                    fi

                    kubectl get namespaces
                    echo "$REGISTRY_PSW" | helm registry login registry.rc.nectar.org.au \
                      --username "$REGISTRY_USR" --password-stdin
                    helm install -n ${{TAG}} --create-namespace dashboard oci://registry.rc.nectar.org.au/nectar-helm/dashboard \
                      --version ^${{helm_version}} \
                      -f dev/dashboard/values.yaml --set image.tag=${{TAG}} \
                      --set conf.token_url=https://${{TAG}}.rcdev.nectar.org.au/auth/websso/ \
                      --set gateway.hostnames={{${{TAG}}.rcdev.nectar.org.au}}
                    '''
                  }}
                }}
                sh '''
                PROJECT=`printf %s $GERRIT_PROJECT | jq -sRr @uri`
                BRANCH=`printf %s $GERRIT_BRANCH | jq -sRr @uri`
                CHANGE_ID=${{PROJECT}}~${{BRANCH}}~${{GERRIT_CHANGE_ID}}
                curl -sSf --user $GERRIT_API -X POST -H 'Content-Type: application/json' \
                  -d "{{'message': 'Test at: https://${{TAG}}.rcdev.nectar.org.au'}}" \
                  https://$GERRIT_HOST/a/changes/$CHANGE_ID/revisions/$GERRIT_PATCHSET_NUMBER/review
                '''
              }}
            }}
          }}
          stage('Trigger e2e') {{
            // The Playwright suite lives in nectar-dashboard. It runs in its
            // own job, which waits for this env to come up and comments on
            // the review; it does not change this job's result or vote.
            when {{ environment name: 'GERRIT_PROJECT', value: 'NeCTAR-RC/nectar-dashboard' }}
            steps {{
              build job: 'dashboard-devenv-e2e', wait: false,
                parameters: [
                  string(name: 'TAG', value: env.TAG),
                  string(name: 'GERRIT_HOST', value: env.GERRIT_HOST),
                  string(name: 'GERRIT_PROJECT', value: env.GERRIT_PROJECT),
                  string(name: 'GERRIT_BRANCH', value: env.GERRIT_BRANCH),
                  string(name: 'GERRIT_REFSPEC', value: env.GERRIT_REFSPEC),
                  string(name: 'GERRIT_CHANGE_ID', value: env.GERRIT_CHANGE_ID),
                  string(name: 'GERRIT_CHANGE_NUMBER', value: env.GERRIT_CHANGE_NUMBER),
                  string(name: 'GERRIT_PATCHSET_NUMBER', value: env.GERRIT_PATCHSET_NUMBER),
                ]
            }}
          }}
        }}
        post {{
          failure {{
            node('internal') {{
              sh '''
              export OS_USERNAME=$KEYSTONE_USR
              export OS_PASSWORD=$KEYSTONE_PSW
              export OS_AUTH_URL=http://ucc1.svc.artm.rcunder.nectar.org.au:5000/v3
              export OS_PROJECT_DOMAIN_NAME=Default
              export OS_USER_DOMAIN_NAME=Default
              export OS_IDENTITY_API_VERSION=3
              export OS_PROJECT_NAME=rcdev
              recordsets=`openstack recordset list rcdev.nectar.org.au. | grep ${{TAG}} | awk '{{print $2}}'`
              for i in $recordsets
              do
                  openstack recordset delete rcdev.nectar.org.au. $i
              done
              '''
            }}
          }}
          cleanup {{
            // Post runs on the pipeline-level docker agent. Don't ask for a
            // second docker executor here: with every docker executor held
            // by a build waiting in cleanup, they deadlock.
            deleteDir() /* clean up our workspace */
          }}
        }}
      }}
- job:
    name: 'dashboard-devenv-e2e'
    description: >-
      Run the nectar-dashboard Playwright e2e suite against a review's dev env. Started by dashboard-devenv-create once the env is deployed; comments the result on the review without voting.
    defaults: global
    project-type: pipeline
    sandbox: true
    parameters:
      - string:
          name: TAG
          description: "The dev env name, review-<change>-<patchset>."
      - string:
          name: GERRIT_HOST
          default: review.rc.nectar.org.au
      - string:
          name: GERRIT_PROJECT
          default: NeCTAR-RC/nectar-dashboard
      - string:
          name: GERRIT_BRANCH
          default: nectar/2025.1
      - string:
          name: GERRIT_REFSPEC
          default: refs/heads/nectar/2025.1
      - string:
          name: GERRIT_CHANGE_ID
      - string:
          name: GERRIT_CHANGE_NUMBER
      - string:
          name: GERRIT_PATCHSET_NUMBER
    properties:
      - throttle:
          max-total: 3
          option: project
      - build-discarder:
          num-to-keep: 30
    dsl: |
      pipeline {{
        agent {{ label 'resolute' }}
        options {{
          timeout(time: 90, unit: 'MINUTES')
        }}
        environment {{
          DASHBOARD_URL = "https://${{params.TAG}}.rcdev.nectar.org.au"
          CI = 'true'
          NPM_CONFIG_REGISTRY = 'https://verdaccio.artm.rc.nectar.org.au/'
        }}
        stages {{
          stage('Checkout') {{
            steps {{
              checkout(
                poll: false,
                scm: [
                  $class: 'GitSCM',
                  branches: [[name: 'refs/remotes/origin/review']],
                  extensions: [[$class: 'CleanCheckout']],
                  userRemoteConfigs: [[
                    credentialsId: 'cd8b8dd3-b897-4ecb-985d-180d5b6f8498',
                    name: 'origin',
                    refspec: '$GERRIT_REFSPEC:refs/remotes/origin/review',
                    url: 'ssh://jenkins@review.rc.nectar.org.au:29418/$GERRIT_PROJECT.git'
                  ]]
                ]
              )
              script {{
                // Branches from before the suite have no e2e tox env.
                if (sh(returnStatus: true, script: 'grep -q "^\\[testenv:e2e\\]" tox.ini') != 0) {{
                  currentBuild.result = 'NOT_BUILT'
                  env.E2E_SKIP = 'true'
                  echo 'No [testenv:e2e] in tox.ini on this branch; nothing to run.'
                }}
              }}
            }}
          }}
          stage('Wait for env') {{
            when {{ not {{ environment name: 'E2E_SKIP', value: 'true' }} }}
            steps {{
              // The env is still building when this job starts: the gateway
              // answers 404 until the HTTPRoute exists and 5xx while the
              // pods start (the startup probe allows up to 15 minutes).
              timeout(time: 40, unit: 'MINUTES') {{
                sh '''#!/bin/bash -u
                until curl -fsS -o /dev/null --max-time 30 "$DASHBOARD_URL/auth/login/"; do
                  sleep 20
                done
                echo "$DASHBOARD_URL is up"
                '''
              }}
            }}
          }}
          stage('E2E') {{
            when {{ not {{ environment name: 'E2E_SKIP', value: 'true' }} }}
            steps {{
              withCredentials([
                file(credentialsId: 'dashboard-e2e-admin-openrc', variable: 'OPENRC'),
                file(credentialsId: 'dashboard-e2e-user-openrc', variable: 'E2E_USER_OPENRC'),
              ]) {{
                sh 'tox -e e2e'
              }}
            }}
          }}
        }}
        post {{
          always {{
            script {{
              if (env.E2E_SKIP != 'true') {{
                def summary = junit(allowEmptyResults: true, testResults: 'e2e/junit.xml')
                archiveArtifacts allowEmptyArchive: true,
                  artifacts: 'e2e/playwright-report/**, e2e/test-results/**'
                def outcome = currentBuild.currentResult == 'SUCCESS' ? 'passed' : 'failed'
                def counts = summary.totalCount > 0 ?
                  " (${{summary.passCount}} passed, ${{summary.failCount}} failed, ${{summary.skipCount}} skipped)" : ''
                gerritComment("E2E tests ${{outcome}}${{counts}} against ${{env.DASHBOARD_URL}}: ${{env.BUILD_URL}}")
              }}
            }}
          }}
          cleanup {{
            deleteDir()
          }}
        }}
      }}
- job:
    name: 'dashboard-devenv-cleanup'
    defaults: global
    project-type: pipeline
    sandbox: true
    parameters:
      - string:
          name: GERRIT_REFSPEC
          default: refs/heads/nectar/2025.1
          description: "The ref to use."
      - string:
          name: GERRIT_BRANCH
          default: nectar/2025.1
          description: "The branch to use."
    triggers:
      - gerrit:
          trigger-on:
            - change-abandoned-event
            - change-merged-event
          projects:
            - project-compare-type: 'PLAIN'
              project-pattern: 'NeCTAR-RC/horizon'
              branches:
                - branch-compare-type: 'REG_EXP'
                  branch-pattern: 'nectar/.*'
            - project-compare-type: 'REG_EXP'
              project-pattern: 'NeCTAR-RC/.*-dashboard'
              branches:
                - branch-compare-type: 'REG_EXP'
                  branch-pattern: 'nectar/.*'
            - project-compare-type: 'REG_EXP'
              project-pattern: 'NeCTAR-RC/.*-ui'
              branches:
                - branch-compare-type: 'REG_EXP'
                  branch-pattern: 'nectar/.*'
          silent: false
          escape-quotes: true
    dsl: |
      pipeline {{
        agent {{ label 'internal' }}
        environment {{
          KEYSTONE = credentials('6457de6c-a455-49b4-a217-382a8425b4d6')
        }}
        stages {{
          stage('Cleanup') {{
            steps {{
              sh '''
              export OS_USERNAME=$KEYSTONE_USR
              export OS_PASSWORD=$KEYSTONE_PSW
              export OS_AUTH_URL=http://ucc1.svc.artm.rcunder.nectar.org.au:5000/v3
              export OS_PROJECT_DOMAIN_NAME=Default
              export OS_USER_DOMAIN_NAME=Default
              export OS_IDENTITY_API_VERSION=3
              export OS_PROJECT_NAME=rcdev

              TAG_BASE=review-$GERRIT_CHANGE_NUMBER

              recordsets=`openstack recordset list rcdev.nectar.org.au. | grep ${{TAG_BASE}} | awk '{{print $2}}'`
              for i in $recordsets
              do
                  openstack recordset delete rcdev.nectar.org.au. $i
              done
              '''

              withKubeConfig([credentialsId: 'ef3bf1e0-6c6b-4bb9-80cc-4bd51e8edd89',
                    serverUrl: 'https://k8s-api.rcdev.nectar.org.au:6443',
              ]) {{
                sh '''
                  TAG_BASE=review-$GERRIT_CHANGE_NUMBER
                  namespaces=`kubectl get namespaces | grep ${{TAG_BASE}} | awk '{{print $1}}'`
                  for namespace in $namespaces
                  do
                      kubectl delete namespace $namespace
                  done
                  '''
              }}
            }}
          }}
        }}
      }}
